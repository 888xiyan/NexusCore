services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-pg-m2
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: nexus_dev_super
    ports:
      - "${NEXUS_DEV_PG_PORT:-55432}:5432"
    volumes:
      - ./scripts/init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql:ro
      - nexus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexus_pg_data:
